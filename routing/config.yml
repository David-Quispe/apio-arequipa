graphhopper:
  datareader.file: data/corridor.osm
  graph.location: data/graph-cache

  profiles:
    - name: car
      custom_model_files: [apio_car.json]

  profiles_ch:
    - profile: car

  graph.encoded_values: car_access, car_average_speed, road_access, road_class, lanes

  import.osm.ignored_highways: footway,construction,cycleway,path,steps

  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
